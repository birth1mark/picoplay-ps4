name: PicoPlay CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE.MD'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE.MD'
      - '.gitignore'
  workflow_dispatch:

jobs:
  desktop-build:
    name: Desktop Build (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && break || sleep 5; done || true
          sudo apt-get install -y --fix-missing -o Acquire::Retries=3 -o Acquire::http::Timeout=20 build-essential libsdl2-dev libcurl4-openssl-dev

      - name: Compile Desktop
        run: make desktop

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picoplay-desktop-linux-x86_64
          path: platform/SDL2Desktop/picoplay

  ps4-build:
    name: PlayStation 4 Build & Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain Dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && break || sleep 5; done || true
          sudo apt-get install -y --fix-missing -o Acquire::Retries=3 -o Acquire::http::Timeout=20 clang lld imagemagick python3

      - name: Download & Setup OpenOrbis PS4 Toolchain
        run: |
          mkdir -p $HOME/toolchains
          curl -L -o /tmp/openorbis.tar.gz "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
          tar -xzf /tmp/openorbis.tar.gz -C $HOME/toolchains/
          rm -f /tmp/openorbis.tar.gz

      - name: Setup OpenSSL 1.1 for PkgTool.Core
        run: |
          mkdir -p $HOME/toolchains/lib
          curl -L -o /tmp/libssl.deb "http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb"
          dpkg -x /tmp/libssl.deb /tmp/libssl_extracted
          cp -d /tmp/libssl_extracted/usr/lib/x86_64-linux-gnu/lib* $HOME/toolchains/lib/
          rm -rf /tmp/libssl.deb /tmp/libssl_extracted

      - name: Build PS4 eboot.bin & picoplay-ps4.pkg
        run: |
          export OPENORBIS="$HOME/toolchains/OpenOrbis/PS4Toolchain"
          export OO_PS4_TOOLCHAIN="$OPENORBIS"
          make ps4
          make pkg

      - name: Upload PS4 Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picoplay-ps4-pkg
          path: |
            picoplay-ps4.pkg
            pkg/eboot.bin
